<svg xmlns="http://www.w3.org/2000/svg" width="720" height="44" viewBox="0 0 720 44" fill="none">
<style>text{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace;}</style>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
