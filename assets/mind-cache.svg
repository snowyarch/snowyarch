<svg xmlns="http://www.w3.org/2000/svg" width="720" height="262" viewBox="0 0 720 262" fill="none">
<style>text{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace;}</style>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
<path d="M24 0H0V24" stroke="#30435E" stroke-width="0.6" opacity="0.45"/>
</pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
