</filter>
<linearGradient id="fadeR" x1="0" x2="1" y1="0" y2="0">
<stop offset="0" stop-color="#2D8CFF" stop-opacity="0.9"/>
<stop offset="1" stop-color="#2D8CFF" stop-opacity="0"/>
</linearGradient>
<linearGradient id="fadeP" x1="0" x2="1" y1="0" y2="0">
<stop offset="0" stop-color="#FF4FCB" stop-opacity="0"/>
<stop offset="0.5" stop-color="#FF4FCB" stop-opacity="0.9"/>
<stop offset="1" stop-color="#FF4FCB" stop-opacity="0"/>
</linearGradient>
<linearGradient id="reflect" x1="0" x2="0" y1="0" y2="1">
<stop offset="0" stop-color="#FF4FCB" stop-opacity="0.28"/>
<stop offset="1" stop-color="#FF4FCB" stop-opacity="0"/>
</linearGradient>
<linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
<stop offset="0" stop-color="#070A10"/>
<stop offset="1" stop-color="#0E1830"/>
</linearGradient>
