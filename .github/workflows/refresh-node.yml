name: refresh node

# Regenerates assets/dynamic/ from public repo data. Scheduled runs only
# happen on the default branch. There is no push trigger, and commits made
# with GITHUB_TOKEN never start new workflow runs, so this cannot loop.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-node
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate dynamic modules
        run: python3 scripts/build_dynamic_modules.py

      - name: Commit only if the generated assets changed
        run: |
          if [ -z "$(git status --porcelain -- assets/dynamic)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dynamic
          git commit -m "chore(node): refresh dynamic signals"
          git push
